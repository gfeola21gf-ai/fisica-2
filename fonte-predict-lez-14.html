<script>document.getElementById('testo').innerHTML = marked.parse("# Predict Lezione 14 \u2013 Energia e forze nei condensatori\n\nFonte di studio per un podcast di Predict. Riferimento: Mencuccini-Silvestrini cap. 2 \u2013 \u00a73 Sistemi di condensatori (p. 84), \u00a74 Energia del campo elettrostatico (p. 88), \u00a75 Azioni meccaniche nei conduttori (p. 94).\nScopo: capire COME FUNZIONANO le cose prima della lezione, con immagini da visualizzare. I calcoli li far\u00e0 il professore.\n\n---\n\n## 0. Da dove partiamo\n\nUn condensatore sono due conduttori affacciati, uno con carica +Q e l'altro con \u2212Q. Tra loro c'\u00e8 un campo elettrico e una differenza di potenziale V. La capacit\u00e0 C = Q/V dice \"quanta carica riesco a stipare per ogni volt di tensione\", e dipende solo dalla forma: per il condensatore piano C = \u03b5\u2080A/d (piastre grandi e vicine = tanta capacit\u00e0).\n\n**La metafora guida di tutta la lezione: il serbatoio d'acqua.**\nImmagina un serbatoio cilindrico che si riempie d'acqua dal basso.\n- La **quantit\u00e0 d'acqua** \u00e8 la carica Q.\n- L'**altezza del livello** \u00e8 la tensione V.\n- La **larghezza della base** del serbatoio \u00e8 la capacit\u00e0 C: un serbatoio largo contiene tanta acqua con un livello basso.\nQuindi Q = C\u00b7V diventa \"volume = area di base \u00d7 altezza\". Questa immagine funziona sorprendentemente bene per quasi tutta la lezione.\nDove NON funziona: l'acqua \u00e8 una sola, mentre nel condensatore ci sono due cariche opposte che si separano. E nel condensatore non c'\u00e8 gravit\u00e0: la \"salita\" \u00e8 la fatica di spingere carica positiva verso l'armatura gi\u00e0 positiva, che la respinge.\n\n---\n\n## 1. Condensatori in parallelo e in serie\n\n### Parallelo \u2013 \"serbatoi comunicanti\"\n**Immagina** due serbatoi affiancati, collegati da un tubo sul fondo. L'acqua si livella: hanno per forza lo stesso livello.\n**Come funziona:** in parallelo le armature sono collegate da fili conduttori, e un conduttore \u00e8 tutto allo stesso potenziale. Quindi i condensatori hanno la stessa tensione V. Le cariche si sommano.\n**Risultato:** \u00e8 come un unico serbatoio con base pi\u00f9 larga \u2192 le capacit\u00e0 si sommano: C = C\u2081 + C\u2082.\n**Immagine geometrica:** due condensatori piani in parallelo sono come un unico condensatore con piastre pi\u00f9 grandi (A\u2081 + A\u2082).\n\n### Serie \u2013 \"il gap si allunga\"\n**Immagina** due condensatori piani impilati uno sopra l'altro: la piastra inferiore del primo \u00e8 collegata alla piastra superiore del secondo.\n**Come funziona:** metto +Q sulla prima piastra in alto. Per induzione, la piastra di fronte si carica \u2212Q. Ma quella piastra \u00e8 collegata alla successiva, che era neutra: se una parte \u00e8 \u2212Q, l'altra deve essere +Q. Cos\u00ec la stessa carica Q si \"trasmette\" lungo tutta la catena, come una fila di persone che si passano lo stesso secchio. Le tensioni invece si sommano: per andare dall'inizio alla fine devo superare tutti i salti di tensione.\n**Risultato:** 1/C = 1/C\u2081 + 1/C\u2082, e la capacit\u00e0 totale \u00e8 pi\u00f9 piccola di ciascuna.\n**Perch\u00e9 ha senso (immagine chiave):** due condensatori piani uguali in serie sono come un unico condensatore con la distanza tra le piastre raddoppiata. Piastre pi\u00f9 lontane = meno capacit\u00e0.\n**Trucco:** \u00e8 il contrario delle resistenze.\n\n---\n\n## 2. Energia immagazzinata: perch\u00e9 c'\u00e8 quel \u00bd\n\n### La scena\n**Immagina** di riempire il serbatoio pompando acqua dall'alto, un secchio alla volta. I primi secchi li sollevi poco: il serbatoio \u00e8 vuoto, il bordo da superare \u00e8 basso. Gli ultimi secchi li devi portare fino al livello finale. In media, ogni secchio \u00e8 stato sollevato a **met\u00e0** dell'altezza finale.\n\n### Come funziona nel condensatore\nCaricare un condensatore significa prendere un pezzetto di carica dq dall'armatura negativa e portarlo su quella positiva. All'inizio \u00e8 facile: le armature sono quasi scariche, la tensione \u00e8 quasi zero. Ma ogni pezzetto rende l'armatura positiva pi\u00f9 positiva, quindi il pezzetto successivo viene respinto di pi\u00f9: la tensione da vincere cresce man mano, v = q/C. Sommando il lavoro di tutti i pezzetti, da carica zero a carica Q, si ottiene:\n\n**U = \u00bd Q V = \u00bd C V\u00b2 = Q\u00b2/(2C)**\n\nIl \u00bd \u00e8 esattamente la \"media\" dei secchi: la tensione \u00e8 cresciuta da 0 a V, in media hai lavorato contro V/2.\n**Analogia gemella:** l'energia di una molla, \u00bd k x\u00b2. Anche l\u00ec la forza cresce mentre la comprimi.\n\n### Esempi che si possono immaginare\n- **Il flash della macchina fotografica:** la pila lo carica lentamente (senti il fischio acuto) e il condensatore rilascia tutta l'energia in un lampo di un millesimo di secondo. La pila da sola non darebbe mai una potenza cos\u00ec alta.\n- **Il defibrillatore:** accumula centinaia di joule nel condensatore e li scarica in un istante attraverso il torace.\nIl condensatore \u00e8 un \"serbatoio di energia che si svuota di colpo\".\n\n---\n\n## 3. L'energia sta nel campo (il cambio di prospettiva della lezione)\n\n### La domanda\nL'energia \u00bdCV\u00b2 dove si trova fisicamente? Sulle armature? Nelle cariche?\n\n### L'immagine di Faraday: elastici tesi\n**Immagina** le linee di campo tra le due armature come tanti **elastici tesi**, che partono dalle cariche + e arrivano alle cariche \u2212. Caricare il condensatore \u00e8 come tendere sempre pi\u00f9 elastici, sempre pi\u00f9 forte. L'energia \u00e8 immagazzinata nella tensione degli elastici, cio\u00e8 **nello spazio tra le armature, dove c'\u00e8 il campo**.\n\n### Come si vede con i conti (lo far\u00e0 il prof)\nNel condensatore piano: U = \u00bdCV\u00b2, con C = \u03b5\u2080A/d e V = E\u00b7d. Sostituendo si ottiene U = \u00bd\u03b5\u2080E\u00b2 \u00d7 (A\u00b7d). Ma A\u00b7d \u00e8 proprio il volume tra le piastre! Quindi l'energia per unit\u00e0 di volume \u00e8:\n\n**u = \u00bd \u03b5\u2080 E\u00b2** (densit\u00e0 di energia)\n\nDove il campo \u00e8 forte, c'\u00e8 tanta energia per metro cubo. Dove il campo \u00e8 zero (dentro un conduttore), non c'\u00e8 energia.\n**Vale per qualunque campo**, non solo nel condensatore. L'energia totale si trova \"sommando\" u su tutto lo spazio, come si pesa una nuvola sommando l'acqua contenuta in ogni metro cubo.\n\n### Modello che il prof potrebbe fare alla lavagna\nLa sfera conduttrice carica: il campo esiste solo fuori dalla sfera e si indebolisce allontanandosi. Si somma \u00bd\u03b5\u2080E\u00b2 su tanti gusci sferici (come gli strati di una cipolla) dal raggio R fino all'infinito, e si ritrova esattamente \u00bdQV. Due strade diverse, stesso risultato: la conferma che l'energia sta davvero nel campo.\n\n---\n\n## 4. Le forze tra le armature\n\n### La scena\nLe armature hanno cariche opposte, quindi si attraggono. Torniamo agli elastici: gli elastici tesi tra le piastre **tirano** le piastre una verso l'altra. Ecco la forza.\n\n### Perch\u00e9 ancora un \u00bd: \"non puoi sollevarti tirandoti per i lacci delle scarpe\"\nIl campo tra le piastre \u00e8 \u03c3/\u03b5\u2080, ma questo campo \u00e8 la somma di due contributi uguali: \u03c3/(2\u03b5\u2080) della piastra positiva e \u03c3/(2\u03b5\u2080) di quella negativa. **Una piastra non pu\u00f2 spingere s\u00e9 stessa**: ogni piastra sente solo il campo dell'ALTRA, cio\u00e8 met\u00e0 del campo totale.\nRisultato per il condensatore piano: **F = Q\u00b2/(2\u03b5\u2080A)**, attrattiva.\n\n### Il metodo dei \"lavori virtuali\" (il trucco del prof)\nInvece di calcolare la forza direttamente, si immagina di spostare un'armatura di un pochino, dx, e si guarda come cambia l'energia. \u00c8 come capire quanto tira un elastico misurando quanta energia serve per allungarlo di un millimetro.\n\n### La trappola pi\u00f9 importante: condensatore isolato o collegato?\n**Caso 1 \u2013 Condensatore ISOLATO (Q costante).** Immagina un sacchetto chiuso: la carica non pu\u00f2 n\u00e9 entrare n\u00e9 uscire. Se allontani le piastre, gli elastici restano tesi uguale (il campo E resta lo stesso), ma diventano pi\u00f9 lunghi: c'\u00e8 pi\u00f9 volume pieno di campo. L'energia **aumenta**, e quell'energia ce la metti tu tirando. Formula: F = \u2212dU/dx.\n\n**Caso 2 \u2013 Condensatore COLLEGATO alla pila (V costante).** Ora la pila \u00e8 come una **pompa che tiene fisso il livello** del serbatoio. Se allontani le piastre la capacit\u00e0 cala, quindi una parte della carica torna indietro nella pila. L'energia del condensatore **diminuisce**, eppure tu fai comunque fatica a tirare! Dove va l'energia? Nella pila, che viene \"ricaricata\" dalla carica che rientra. Per questo nella formula il segno cambia: F = +dU/dx.\nLa forza fisica che senti \u00e8 la stessa: cambia solo chi paga il conto energetico.\n\n### Pressione elettrostatica sui conduttori\nSulla superficie di qualunque conduttore carico c'\u00e8 una spinta verso l'esterno, come se la superficie venisse \"tirata fuori\" dalle linee di campo che escono:\n**p = \u03c3\u00b2/(2\u03b5\u2080) = \u00bd \u03b5\u2080 E\u00b2**\nCuriosit\u00e0 da notare: \u00e8 numericamente uguale alla densit\u00e0 di energia. Non \u00e8 un caso: nell'immagine degli elastici, la tensione per unit\u00e0 di superficie e l'energia per unit\u00e0 di volume sono la stessa grandezza.\n**Immagine:** una bolla di sapone caricata elettricamente tende a gonfiarsi, perch\u00e9 le cariche sulla superficie si respingono e spingono verso l'esterno.\n\n---\n\n## 5. Le trappole da evitare\n1. **Q costante o V costante?** \u00c8 la prima domanda da farsi in ogni esercizio su energia e forze. Isolato \u2192 Q fisso. Collegato alla pila \u2192 V fisso.\n2. **Il \u00bd nella forza:** ogni piastra sente solo il campo dell'altra.\n3. **L'energia non sta \"sulle armature\":** sta nel campo, nello spazio tra di esse.\n4. **In serie la capacit\u00e0 diminuisce**, in parallelo aumenta (il contrario delle resistenze).\n\n## 6. Tre domande da tenere in testa durante la lezione\n1. Se allontano le piastre di un condensatore isolato, l'energia aumenta o diminuisce? Chi fa il lavoro? E se \u00e8 collegato alla pila?\n2. Perch\u00e9 la densit\u00e0 di energia \u00bd\u03b5\u2080E\u00b2 e la pressione elettrostatica \u03c3\u00b2/2\u03b5\u2080 hanno lo stesso valore?\n3. Perch\u00e9 due condensatori in serie \"valgono meno\" di uno solo? (Pensa alle piastre che si allontanano.)\n");</script>
