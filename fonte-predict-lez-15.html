<script>document.getElementById('testo').innerHTML = marked.parse("# Predict Lezione 15 \u2013 Forze tra conduttori e primo sguardo ai dielettrici\n\nFonte di studio per un podcast di Predict. Riferimento: Mencuccini-Silvestrini cap. 2 \u2013 \u00a75 Azioni meccaniche di natura elettrostatica nei conduttori (p. 94); se il professore va avanti: cap. 3 \u2013 Elettrostatica in presenza di dielettrici, \u00a71 Costante dielettrica (p. 117), \u00a72 Interpretazione microscopica (p. 119: polarizzazione per deformazione p. 120, per orientamento p. 121).\nScopo: capire COME FUNZIONANO le cose prima della lezione, con immagini da visualizzare. I calcoli li far\u00e0 il professore.\n\n---\n\n## 0. Da dove partiamo (riassunto della lezione 14)\n\n- Caricare un condensatore costa lavoro: ogni pezzetto di carica dq va spinto contro una tensione che cresce man mano. Il totale \u00e8 U = \u00bd C V\u00b2 = Q\u00b2/(2C). Il \u00bd c'\u00e8 perch\u00e9 la tensione \u00e8 cresciuta da zero a V: in media hai lavorato contro met\u00e0 della tensione finale.\n- Quell'energia sta nel campo, nello spazio tra le armature: ogni metro cubo di campo contiene w = \u00bd \u03b5\u2080 E\u00b2. L'energia totale si trova sommando w su tutto il volume dove c'\u00e8 campo.\n- In parallelo i condensatori hanno la stessa tensione e le capacit\u00e0 si sommano. In serie hanno la stessa carica e la capacit\u00e0 totale diminuisce.\n\n**La metafora guida di tutta la lezione: le linee di campo come elastici tesi.**\nImmagina tante linee di campo tra le due armature, come elastici tesi che partono dalle cariche + e arrivano alle cariche \u2212.\n- Pi\u00f9 carica sulle armature = pi\u00f9 elastici.\n- Pi\u00f9 campo = elastici pi\u00f9 tesi.\n- L'energia \u00e8 la tensione accumulata negli elastici.\nQuesta lezione usa gli elastici due volte: prima per capire perch\u00e9 le armature si attirano (gli elastici tirano), poi per capire cosa fa un materiale isolante messo in mezzo (scarica una parte della tensione degli elastici).\nDove NON funziona: un elastico vero tirato si allunga e tira di pi\u00f9. Una linea di campo no: nel condensatore piano isolato puoi allontanare le piastre e gli \"elastici\" tirano sempre uguale (il campo non cambia), diventano solo pi\u00f9 lunghi.\n\n---\n\n## 1. Le armature si attirano: la forza tra conduttori\n\n### La scena\n**Immagina** un condensatore piano con le piastre appese a due molle. Lo carichi: le piastre si avvicinano un po' da sole. Le cariche opposte si attirano e gli elastici tesi tra le piastre le tirano una verso l'altra.\n\n### Come funziona: perch\u00e9 la forza ha un \u00bd\nIl campo tra le piastre \u00e8 E = \u03c3/\u03b5\u2080, ma \u00e8 fatto di due met\u00e0 uguali: \u03c3/(2\u03b5\u2080) prodotto dalla piastra positiva e \u03c3/(2\u03b5\u2080) prodotto da quella negativa. **Una piastra non pu\u00f2 tirare s\u00e9 stessa**, come nessuno si solleva tirandosi per i lacci delle scarpe. Ogni piastra sente solo il campo dell'ALTRA, cio\u00e8 met\u00e0 del campo totale.\n**Risultato:** la forza tra le armature \u00e8 F = Q\u00b2/(2\u03b5\u2080A), attrattiva.\n\n### La pressione elettrostatica\nLo stesso ragionamento vale per **qualunque conduttore carico**: ogni pezzetto di superficie viene tirato verso l'esterno, verso dove escono le linee di campo.\n**Immagina** un palloncino di gomma conduttiva caricato: le cariche sulla superficie si respingono e il palloncino tende a gonfiarsi.\n**Risultato:** pressione p = \u03c3\u00b2/(2\u03b5\u2080) = \u00bd \u03b5\u2080 E\u00b2.\n\u00c8 lo stesso valore della densit\u00e0 di energia w. Non \u00e8 un caso: negli elastici, \"tensione per metro quadro\" ed \"energia per metro cubo\" sono la stessa cosa.\nAttenzione: la pressione spinge sempre **verso l'esterno** del conduttore, qualunque sia il segno della carica (c'\u00e8 \u03c3\u00b2, non \u03c3).\n\n---\n\n## 2. Il metodo dei lavori virtuali: trovare la forza dall'energia\n\n### La scena\n**Immagina** di voler sapere quanto tira un elastico senza dinamometro. Lo allunghi di un millimetro e misuri quanta energia ci hai messo: energia diviso spostamento = forza. Il professore far\u00e0 la stessa cosa: sposta \"per finta\" (virtualmente) un'armatura di un tratto dx e guarda come cambia l'energia U.\n\n### Come funziona: la domanda decisiva \u00e8 \"chi paga?\"\n**Caso 1 \u2013 Condensatore ISOLATO (Q costante).** Il condensatore \u00e8 un sacchetto chiuso: la carica non entra e non esce.\n- Allontano le piastre \u2192 il campo E resta uguale, ma c'\u00e8 pi\u00f9 volume pieno di campo \u2192 l'energia U **aumenta**.\n- Quell'energia in pi\u00f9 ce la metto io tirando contro l'attrazione.\n- Formula: F = \u2212dU/dx (la forza punta dove l'energia diminuisce, cio\u00e8 verso l'avvicinamento).\n\n**Caso 2 \u2013 Condensatore COLLEGATO alla pila (V costante).** La pila \u00e8 una pompa che tiene fisso il livello.\n- Allontano le piastre \u2192 la capacit\u00e0 C cala \u2192 con V fisso, Q = CV cala: un po' di carica torna nella pila.\n- L'energia del condensatore \u00bdCV\u00b2 **diminuisce**, eppure io faccio comunque fatica a tirare!\n- Dove va l'energia? Nella pila, che viene \"ricaricata\" dalla carica che rientra. Riceve due contributi uguali: l'energia persa dal condensatore e il lavoro fatto da me.\n- Formula: F = +dU/dx (il segno si ribalta perch\u00e9 c'\u00e8 un terzo attore, la pila, che scambia energia).\n\n**Il punto chiave:** la forza fisica tra le piastre \u00e8 la stessa nei due casi, a parit\u00e0 di carica in quell'istante. Cambia solo il conto energetico: chi paga e chi incassa.\n\n### Metafora e limite\n\u00c8 come spostare un mobile in un trasloco: la fatica \u00e8 la stessa, ma nel caso 1 paghi tutto tu, nel caso 2 c'\u00e8 un socio (la pila) che entra nei conti.\nIl limite: nella realt\u00e0 spostare le piastre richiede tempo e nel filo scorre corrente. I lavori virtuali immaginano uno spostamento piccolissimo e lentissimo.\n\n---\n\n## 3. (Se il professore va avanti) Il dielettrico: un isolante tra le armature\n\n### La scena\n**Immagina** un condensatore carico e isolato, con un voltmetro collegato che segna 100 V. Infili tra le piastre una lastra di vetro o di plastica, che \u00e8 un isolante: non tocca le armature e non porta carica netta. Il voltmetro scende, per esempio a 20 V. La carica \u00e8 sempre la stessa, ma la tensione \u00e8 calata.\n\n### Come funziona\n- Q uguale e V pi\u00f9 bassa \u2192 C = Q/V \u00e8 **aumentata**.\n- Il numero che dice di quanto si chiama **costante dielettrica relativa** \u03ba (nel Mencuccini anche \u03b5\u1d63): C = \u03ba C\u2080, con \u03ba > 1 (aria circa 1, vetro tra 4 e 10, acqua circa 80).\n- Se V cala con la stessa distanza tra le piastre, allora anche il campo dentro \u00e8 calato: E = E\u2080/\u03ba.\n\n### Il perch\u00e9 microscopico: gli elastici \"si scaricano\"\nIl materiale \u00e8 fatto di atomi e molecole. Il campo li trasforma in **piccoli dipoli** allineati: la parte positiva viene spinta da una parte, la negativa dall'altra. Questi mini-dipoli producono un loro campo che va **contro** quello delle armature, e una parte degli elastici viene \"agganciata\" dalle cariche del materiale invece di arrivare all'altra armatura. Il campo netto si indebolisce.\nEcco perch\u00e9 la mappa del **dipolo (MT04)** serve adesso: il dielettrico \u00e8 un enorme esercito di dipoli.\n\n### Due modi di diventare dipolo (Mencuccini p. 120-121)\n1. **Polarizzazione per deformazione (elettronica).** **Immagina** un atomo come un nucleo dentro una nuvola di elettroni. Il campo tira il nucleo da una parte e la nuvola dall'altra: la nuvola si sposta un pochino e l'atomo diventa un dipolo. Vale per tutti i materiali.\n2. **Polarizzazione per orientamento.** Alcune molecole, come l'acqua, sono gi\u00e0 dipoli per conto loro, ma orientati a caso: si annullano. Il campo li fa ruotare (ricordi il momento \u03c4 = p \u00d7 E?) e li allinea in parte, mentre l'agitazione termica li rimescola. Per questo l'acqua ha \u03ba cos\u00ec alto.\n\n### Metafora e limite\n\u00c8 come una folla di bussole in una stanza: senza magnete puntano ovunque, con il magnete si girano quasi tutte nella stessa direzione.\nDove smette di funzionare: le bussole si allineano perfettamente, i dipoli molecolari no (il calore li scuote), e gli atomi della polarizzazione per deformazione non ruotano affatto, si \"stirano\".\n\n---\n\n## 4. Cosa vedrai alla lavagna\n- Il condensatore piano con la forza su una piastra calcolata con il campo dell'altra (\u03c3/2\u03b5\u2080).\n- La derivata dell'energia rispetto alla distanza tra le piastre, nei due casi: Q costante e V costante.\n- La pressione elettrostatica \u03c3\u00b2/2\u03b5\u2080 su un conduttore, forse sulla sfera carica.\n- Forse: il condensatore con la lastra di dielettrico, C = \u03ba C\u2080, e il disegno dell'atomo con la nuvola spostata.\n\n## 5. Le trappole da evitare\n1. **Q costante o V costante?** La prima domanda in ogni esercizio su forze ed energia. Isolato \u2192 Q fisso, F = \u2212dU/dx. Collegato alla pila \u2192 V fisso, F = +dU/dx.\n2. **Il \u00bd nella forza:** ogni piastra sente solo il campo dell'altra, non il campo totale \u03c3/\u03b5\u2080.\n3. **La pressione elettrostatica spinge sempre verso l'esterno**, anche se la carica \u00e8 negativa.\n4. **Il dielettrico non \u00e8 un conduttore:** non annulla il campo dentro di s\u00e9, lo indebolisce soltanto (di un fattore \u03ba).\n\n## 6. Tre domande da tenere in testa durante la lezione\n1. Se allontano le piastre di un condensatore collegato alla pila, l'energia del condensatore diminuisce: allora perch\u00e9 devo comunque tirare?\n2. Perch\u00e9 una piastra sente solo met\u00e0 del campo che c'\u00e8 tra le armature?\n3. Se infilo un dielettrico in un condensatore isolato, la tensione cala: dove \u00e8 finita una parte del campo?\n");</script>
