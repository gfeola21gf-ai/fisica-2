<script>document.getElementById('testo').innerHTML = marked.parse("# Predict 29/10 \u2013 Dal dipolo ai dielettrici\n\nFonte di studio per un podcast di Predict. Lo studente ha perso 3 lezioni: questa fonte ripassa quello che serve (dipolo, condensatore) e anticipa l'argomento pi\u00f9 probabile di oggi, l'elettrostatica nei dielettrici.\nRiferimento: Mencuccini-Silvestrini cap. 3 \u2013 Elettrostatica in presenza di dielettrici: \u00a71 Costante dielettrica (p. 117), \u00a72 Interpretazione microscopica (p. 119), \u00a73 Il vettore polarizzazione elettrica P (p. 124), \u00a74 Equazioni dell'elettrostatica in presenza di dielettrici (p. 130), \u00a75 Condizioni al contorno per E e D (p. 132), \u00a76 Energia elettrostatica in presenza di dielettrici (p. 142).\nScopo: capire COME FUNZIONANO le cose, con immagini da visualizzare. I calcoli li fa il professore.\n\n---\n\n## 0. La metafora guida: la sala da ballo\n\nImmagina una grande sala piena di **coppie di ballerini che si tengono per mano**: in ogni coppia uno \u00e8 \"+\" e l'altro \u00e8 \"\u2212\". Le coppie sono le molecole del materiale isolante, cio\u00e8 dei piccoli dipoli.\n- Senza musica (senza campo) ogni coppia guarda in una direzione a caso: nel complesso la sala non ha nessuna direzione preferita.\n- Quando parte la musica (il campo elettrico), le coppie si girano tutte pi\u00f9 o meno nella stessa direzione e si allungano un po'.\n- Gli **invitati veri**, quelli che sono entrati dalla porta (le cariche che metti tu sulle armature), sono un'altra cosa: si chiamano **cariche libere**.\nQuesta immagine accompagna tutta la lezione.\nDove smette di funzionare: in molti materiali le \"coppie\" non esistono prima della musica. \u00c8 il campo stesso a creare il dipolo, stirando l'atomo (vedi punto 3).\n\n---\n\n## 1. Ripasso lampo: il dipolo elettrico\n\n**Immagina** due cariche uguali e opposte, +q e \u2212q, a distanza piccolissima \u03b4, come un manubrio con un peso rosso e uno blu.\n**Come funziona:**\n- Si descrive con un solo vettore, il **momento di dipolo p = q\u00b7\u03b4**, che punta dalla carica \u2212 alla carica +.\n- In un campo uniforme le due forze sono uguali e opposte: la forza totale \u00e8 zero, ma formano una coppia che fa **ruotare** il dipolo. Il momento \u00e8 \u03c4 = p \u00d7 E.\n- L'energia \u00e8 U = \u2212p\u00b7E: \u00e8 minima quando p \u00e8 allineato con E. Quindi il dipolo tende a girarsi nella direzione del campo, come l'ago di una bussola verso il nord.\n- In un campo **non uniforme** c'\u00e8 anche una forza netta, che tira il dipolo verso dove il campo \u00e8 pi\u00f9 forte. \u00c8 per questo che un pettine strofinato attira i pezzetti di carta: prima li polarizza, poi li tira.\n**Risultato chiave:** un dipolo in un campo si allinea e, se il campo non \u00e8 uniforme, viene attirato verso le zone di campo forte.\n\n---\n\n## 2. Ripasso lampo: il condensatore e il fatto sperimentale\n\n**Immagina** un condensatore piano carico e isolato, con un voltmetro che segna 100 V. Infili tra le piastre una lastra di plastica, senza toccare le armature. Il voltmetro scende, per esempio a 25 V.\n**Come funziona:** la carica Q sulle armature \u00e8 la stessa (il condensatore \u00e8 isolato), ma la tensione \u00e8 calata. Allora:\n- la capacit\u00e0 C = Q/V \u00e8 **aumentata**;\n- con la stessa distanza tra le piastre, anche il campo dentro \u00e8 **calato**.\n**Risultato chiave:** C = \u03ba\u00b7C\u2080 ed E = E\u2080/\u03ba. Il numero \u03ba > 1 \u00e8 la **costante dielettrica relativa** (in alcuni testi \u03b5\u1d63) e dipende solo dal materiale: aria circa 1, plastica 2-3, vetro 4-10, acqua circa 80.\nLa domanda di tutta la lezione: **dove \u00e8 finita una parte del campo?**\n\n---\n\n## 3. Perch\u00e9 succede: due modi di diventare dipolo (p. 119-121)\n\n### Polarizzazione per deformazione (elettronica)\n**Immagina** un atomo come un nucleo positivo al centro di una nuvola di elettroni. Senza campo la nuvola \u00e8 centrata: nessun dipolo.\n**Come funziona:** il campo spinge il nucleo da una parte e la nuvola dall'altra. La nuvola si sposta un pochino e l'atomo diventa un piccolo dipolo, allineato con il campo. Succede in **tutti** i materiali.\n\n### Polarizzazione per orientamento\n**Immagina** l'acqua: ogni molecola \u00e8 gi\u00e0 un dipolo per conto suo, ma le molecole sono orientate a caso e si annullano a vicenda.\n**Come funziona:** il campo le fa ruotare (\u03c4 = p \u00d7 E), mentre l'agitazione termica le rimescola continuamente. Vince un compromesso: un allineamento parziale. Pi\u00f9 fa freddo, pi\u00f9 si allineano. Per questo l'acqua ha \u03ba cos\u00ec alto.\n\n**Nella sala da ballo:** la deformazione \u00e8 il ballerino che si allunga, l'orientamento \u00e8 la coppia che si gira.\n\n---\n\n## 4. Il vettore polarizzazione P (p. 124)\n\n**Immagina** di guardare la sala dall'alto e chiederti, per ogni metro cubo: \"quanto sono allineate le coppie, e in che direzione?\".\n**Come funziona:** **P** \u00e8 il momento di dipolo totale per unit\u00e0 di volume. Dice quanto e in che direzione \u00e8 polarizzato il materiale in quel punto.\nNei materiali pi\u00f9 semplici (lineari e isotropi) P \u00e8 proporzionale al campo: P = \u03b5\u2080 \u03c7 E, dove \u03c7 \u00e8 la suscettivit\u00e0 elettrica, e \u03ba = 1 + \u03c7.\n**Risultato chiave:** P \u00e8 \"la densit\u00e0 di dipoli\". Niente campo, niente P.\n\n---\n\n## 5. Le cariche di polarizzazione: dove finisce il campo\n\n### La scena\n**Immagina** una fila di coppie di ballerini allineate, tutte con il \"+\" a destra e il \"\u2212\" a sinistra. Dentro la fila, il \"+\" di una coppia \u00e8 subito vicino al \"\u2212\" della coppia dopo: da lontano si annullano. Restano **scoperti solo i due capi**: un \"\u2212\" in fondo a sinistra e un \"+\" in fondo a destra.\n\n### Come funziona\n- Se la polarizzazione \u00e8 uniforme, dentro il materiale le cariche si compensano. Compare carica solo **sulle superfici**: \u03c3\u209a = P\u00b7n\u0302 (n\u0302 \u00e8 la normale che esce dalla superficie).\n- Se la polarizzazione non \u00e8 uniforme, le cariche non si compensano del tutto anche dentro: compare \u03c1\u209a = \u2212\u2207\u00b7P.\n- Queste cariche **non si possono staccare** dal materiale: sono legate alle molecole. Per questo si chiamano cariche di polarizzazione (o legate).\n\n### Nel condensatore\nSulla faccia della lastra vicina all'armatura positiva compare carica **negativa**, su quella vicina all'armatura negativa compare carica **positiva**. Queste cariche producono un campo **opposto** a quello delle armature. Il campo netto dentro la lastra \u00e8 pi\u00f9 debole:\n**E = (\u03c3 \u2212 \u03c3\u209a)/\u03b5\u2080**\n**Risposta alla domanda della lezione:** il campo \"manca\" perch\u00e9 una parte delle linee che partono dalle armature si ferma sulle cariche di polarizzazione invece di attraversare la lastra.\n\n---\n\n## 6. Il vettore D: contare solo gli invitati (p. 130)\n\n### Il problema\nLa legge di Gauss per E vuole **tutte** le cariche, libere e di polarizzazione. Ma le cariche di polarizzazione non le conosci in anticipo: dipendono dal campo, che \u00e8 proprio quello che vuoi trovare. \u00c8 un cane che si morde la coda.\n\n### Il trucco\nSi definisce un nuovo vettore, lo **spostamento elettrico**: **D = \u03b5\u2080E + P**.\nCon questa definizione la legge di Gauss diventa:\n**flusso di D attraverso una superficie chiusa = carica libera racchiusa** (in forma locale: \u2207\u00b7D = \u03c1_libera)\n**Nella sala da ballo:** D \u00e8 il conto degli invitati entrati dalla porta. Non importa come ballano le coppie dentro la sala.\nPer i materiali lineari: D = \u03b5\u2080 \u03ba E = \u03b5 E. Il metodo pratico negli esercizi \u00e8 sempre lo stesso: **trovo D con Gauss usando solo le cariche libere, poi divido per \u03b5\u2080\u03ba e ottengo E**.\n\n### Conseguenza: le forze in un dielettrico\nDue cariche immerse in un liquido isolante si attirano o respingono **\u03ba volte meno** che nel vuoto: F = q\u2081q\u2082/(4\u03c0\u03b5\u2080\u03ba r\u00b2). Le molecole intorno a ciascuna carica si orientano e la \"schermano\" in parte. \u00c8 per questo che il sale si scioglie nell'acqua: con \u03ba circa 80, gli ioni Na\u207a e Cl\u207b si attirano 80 volte meno e si staccano.\n\n---\n\n## 7. Al confine tra due materiali (p. 132) e l'energia (p. 142)\n\n**Immagina** le linee di campo che passano dall'aria al vetro, come un raggio di luce che entra nell'acqua: cambiano direzione.\n**Come funziona:** sulla superficie di separazione (senza cariche libere) valgono due regole:\n- la componente di **D perpendicolare** alla superficie non cambia;\n- la componente di **E parallela** alla superficie non cambia.\nNe segue che le linee di campo si \"piegano\" passando da un materiale all'altro (rifrazione delle linee di forza).\n**Energia:** la densit\u00e0 di energia diventa w = \u00bd E\u00b7D, cio\u00e8 \u00bd \u03b5\u2080 \u03ba E\u00b2. Con la stessa tensione, un condensatore con dielettrico accumula \u03ba volte pi\u00f9 energia.\n\n---\n\n## 8. Cosa potresti vedere alla lavagna\n- Il condensatore con la lastra di dielettrico: \u03c3 libere sulle armature, \u03c3\u209a sulle facce della lastra, campo dentro e fuori dalla lastra.\n- La definizione di P e il disegno della fila di dipoli con i capi scoperti.\n- D = \u03b5\u2080E + P e la legge di Gauss per D.\n- Esercizi tipo: condensatore riempito a met\u00e0 (due dielettrici in serie o in parallelo), sfera carica immersa in un dielettrico.\nSe invece il professore \u00e8 gi\u00e0 oltre i dielettrici, il prossimo argomento del programma \u00e8 la **corrente elettrica** (cap. 4, p. 153).\n\n## 9. Le trappole da evitare\n1. **Gauss per D conta solo le cariche libere**, Gauss per E le conta tutte.\n2. **Le cariche di polarizzazione hanno segno opposto** a quelle dell'armatura vicina: per questo indeboliscono il campo.\n3. **Il dielettrico non annulla il campo come un conduttore:** lo riduce soltanto, di un fattore \u03ba.\n4. **Condensatore isolato o collegato?** Isolato (Q fisso): inserendo il dielettrico V cala. Collegato alla pila (V fisso): Q aumenta.\n\n## 10. Tre domande da tenere in testa durante la lezione\n1. Se le cariche di polarizzazione si compensano dentro il materiale, perch\u00e9 compaiono sulla superficie?\n2. Perch\u00e9 conviene usare D invece di E nella legge di Gauss?\n3. Perch\u00e9 due ioni nell'acqua si attirano 80 volte meno che nel vuoto?\n");</script>
